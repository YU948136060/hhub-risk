# hhub-risk 文档站（risk.hydrogen-ion.top）
# 安装：sudo cp risk.hydrogen-ion.top.* /etc/ssl/hhub/ && sudo cp deploy/nginx-risk.conf /etc/nginx/conf.d/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 这台机器没有 443：外部由 8888 端口进来（与主站同一个 listen，靠 SNI/server_name 分流）。
server {
    listen 8888 ssl;
    listen 8000 ssl;
    http2 on;
    server_name risk.hydrogen-ion.top;

    ssl_certificate     /etc/ssl/hhub/risk.hydrogen-ion.top.pem;
    ssl_certificate_key /etc/ssl/hhub/risk.hydrogen-ion.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RISK:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/heavenly-hound/HHub/risk/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # 文档更新后不需要 reload：直接覆盖文件即可
    location /docs/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
