# 示例页：静态文件 + 把 /v1/* 反代到风控服务（同源，避免 CORS）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://risk:8090;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
    }
    location /healthz {
        proxy_pass http://risk:8090;
    }
    location / {
        try_files $uri /index.html;
    }
}
