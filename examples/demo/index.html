<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hhub-risk 示例</title>
<style>body{font:15px/1.7 system-ui,sans-serif;background:#0d1117;color:#e6edf3;max-width:760px;margin:40px auto;padding:0 20px}
button{background:#e8b93c;color:#17130a;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
pre{background:#161b22;border:1px solid #222b36;border-radius:10px;padding:14px;overflow:auto;font-size:13px}
code{color:#e8b93c}</style></head>
<body>
<h2>hhub-risk 示例</h2>
<p>点一下按钮：浏览器采集环境（canvas/WebGL/rAF）→ 解 PoW → 换 token → 再上报一次"像人"的行为遥测。</p>
<button id="run">运行</button>
<pre id="out">（未运行）</pre>
<script src="/hhub-risk.js"></script>
<script>
document.getElementById('run').onclick = async () => {
  const out = document.getElementById('out');
  const log = (m) => { out.textContent += m + '\n'; };
  out.textContent = '';
  try {
    log('处理中…');
    const token = await HHubRisk.init({ endpoint: '' });
    log('token = ' + token);
    log('attest: ' + JSON.stringify(HHubRisk.last()));
    const human = await HHubRisk.score({ pointer: 12, keys: 0, corrections: 1,
      dwell_ms: 9000, video_ms: 3000, visible: true });
    log('human telemetry → ' + JSON.stringify(human));
    const robot = await HHubRisk.score({});
    log('empty telemetry → ' + JSON.stringify(robot));
  } catch (e) {
    log('失败：' + (e && e.message));
  }
};
</script>
</body></html>
