# 三分钟跑通：docker compose up --build
#   风控服务 http://localhost:8090（/healthz）
#   示例页   http://localhost:8092（页面 + /v1 反代）
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  risk:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      RISK_SECRET: ${RISK_SECRET:-change-me-in-production}
      RISK_REDIS: redis://redis:6379/0
    ports:
      - "8090:8090"
    depends_on:
      - redis
    restart: unless-stopped

  demo:
    image: nginx:1.27-alpine
    volumes:
      - ./web/hhub-risk.js:/usr/share/nginx/html/hhub-risk.js:ro
      - ./examples/demo/index.html:/usr/share/nginx/html/index.html:ro
      - ./examples/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8092:80"
    depends_on:
      - risk
    restart: unless-stopped
